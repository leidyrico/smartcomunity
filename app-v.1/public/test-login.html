<!DOCTYPE html>
<html lang="es">

<head>
    <title>Smart Community - Sign In</title>
    <!-- HTML5 Shim and Respond.js IE10 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
    <!--[if lt IE 10]>
      <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
      <script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
      <![endif]-->
    <!-- Meta -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="Smart Community Login">
    <meta name="keywords" content="Admin , Responsive, Landing, Bootstrap, App, Template, Mobile, iOS, Android, apple, creative app">
    <meta name="author" content="Smart Community">
    
    <!-- Favicon icon -->
    <link rel="icon" href="../resources/images/favicon.ico" type="image/x-icon">
    
    <!-- Google font-->
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,600,800" rel="stylesheet">
    
    <!-- Required Fremwork -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- themify-icons line icon -->
    <link rel="stylesheet" type="text/css" href="../resources/icon/themify-icons/themify-icons.css">
    <!-- ico font -->
    <link rel="stylesheet" type="text/css" href="../resources/icon/icofont/css/icofont.css">
    <!-- Style.css -->
    <link rel="stylesheet" type="text/css" href="../resources/css/style.css">
    
    <!-- Estilos adicionales para mensajes de error -->
    <style>
        .error-message {
            color: #dc3545;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
        .form-group.has-error .form-control {
            border-color: #dc3545;
        }
        .alert {
            margin-bottom: 20px;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>

<body class="fix-menu">
    <!-- Pre-loader start -->
    <div class="theme-loader">
        <div class="ball-scale">
            <div class='contain'>
                <div class="ring"><div class="frame"></div></div>
                <div class="ring"><div class="frame"></div></div>
                <div class="ring"><div class="frame"></div></div>
                <div class="ring"><div class="frame"></div></div>
                <div class="ring"><div class="frame"></div></div>
                <div class="ring"><div class="frame"></div></div>
                <div class="ring"><div class="frame"></div></div>
                <div class="ring"><div class="frame"></div></div>
                <div class="ring"><div class="frame"></div></div>
                <div class="ring"><div class="frame"></div></div>
            </div>
        </div>
    </div>
    <!-- Pre-loader end -->

    <section class="login-block">
        <!-- Container-fluid starts -->
        <div class="container">
            <div class="row">
                <div class="col-sm-12">
                    <!-- Authentication card start -->
                    
                    <form class="md-float-material form-material" method="POST" action="#" id="loginForm">
                        <div class="text-center">
                            <img src="../resources/images/logo.png" alt="logo.png">
                        </div>
                        <div class="auth-box card">
                            <div class="card-block">
                                <div class="row m-b-20">
                                    <div class="col-md-12">
                                        <h3 class="text-center">Sign In</h3>
                                    </div>
                                </div>
                                
                                <!-- Mensaje de alerta dinámico -->
                                <div id="alertMessage" class="alert" style="display: none;"></div>
                                
                                <div class="form-group form-primary" id="emailGroup">
                                    <input type="email" 
                                           name="email" 
                                           id="email" 
                                           class="form-control" 
                                           required 
                                           placeholder="Your Email Address"
                                           autocomplete="email" 
                                           autofocus>
                                    <span class="form-bar"></span>
                                    <div class="error-message" id="emailError">Por favor ingrese un email válido</div>
                                </div>
                                
                                <div class="form-group form-primary" id="passwordGroup">
                                    <input type="password" 
                                           name="password" 
                                           id="password" 
                                           class="form-control" 
                                           required 
                                           placeholder="Password"
                                           autocomplete="current-password">
                                    <span class="form-bar"></span>
                                    <div class="error-message" id="passwordError">La contraseña es requerida</div>
                                </div>
                                
                                <div class="row m-t-25 text-left">
                                    <div class="col-12">
                                        <div class="checkbox-fade fade-in-primary d-">
                                            <label>
                                                <input type="checkbox" 
                                                       name="remember" 
                                                       id="rememberMe">
                                                <span class="cr"><i class="cr-icon icofont icofont-ui-check txt-primary"></i></span>
                                                <span class="text-inverse">Remember me</span>
                                            </label>
                                        </div>
                                        <div class="forgot-phone text-right f-right">
                                            <a href="#" class="text-right f-w-600">Forgot Password?</a>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="row m-t-30">
                                    <div class="col-md-12">
                                        <button type="submit" id="signInBtn" class="btn btn-primary btn-md btn-block waves-effect waves-light text-center m-b-20">
                                            <span id="btnText">Sign in</span>
                                            <span id="btnSpinner" style="display: none;">
                                                <i class="fa fa-spinner fa-spin"></i> Signing in...
                                            </span>
                                        </button>
                                    </div>
                                </div>
                                
                                <hr>
                                
                                <div class="row">
                                    <div class="col-md-10">
                                        <p class="text-inverse text-left m-b-0">Thank you.</p>
                                        <p class="text-inverse text-left">
                                            <a href="#"><b class="f-w-600">Back to website</b></a>
                                        </p>
                                    </div>
                                    <div class="col-md-2">
                                        <img src="../resources/images/auth/Logo-small-bottom.png" alt="small-logo.png">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                    <!-- end of form -->
                </div>
                <!-- end of col-sm-12 -->
            </div>
            <!-- end of row -->
        </div>
        <!-- end of container-fluid -->
    </section>
    
    <!-- Required Jquery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <!-- jquery slimscroll js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jQuery.slimScroll/1.3.8/jquery.slimscroll.min.js"></script>
    <!-- modernizr js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/modernizr/2.8.3/modernizr.min.js"></script>
    <!-- i18next.min.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/i18next/21.10.0/i18next.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/i18next-xhr-backend/3.2.2/i18nextXHRBackend.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/i18next-browser-languagedetector/6.1.8/i18nextBrowserLanguageDetector.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-i18next/1.2.1/jquery-i18next.min.js"></script>
    <script type="text/javascript" src="../resources/js/common-pages.js"></script>

    <!-- Script personalizado para el login -->
    <script>
        $(document).ready(function() {
            // Función para mostrar mensajes
            function showMessage(message, type) {
                const alertDiv = $('#alertMessage');
                alertDiv.removeClass('alert-success alert-danger alert-warning');
                alertDiv.addClass('alert-' + type);
                alertDiv.text(message);
                alertDiv.show();
                
                // Auto-ocultar después de 5 segundos
                setTimeout(function() {
                    alertDiv.fadeOut();
                }, 5000);
            }

            // Función para validar email
            function isValidEmail(email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email);
            }

            // Función para limpiar errores
            function clearErrors() {
                $('.form-group').removeClass('has-error');
                $('.error-message').hide();
            }

            // Función para mostrar error en campo específico
            function showFieldError(fieldId, errorId) {
                $('#' + fieldId).addClass('has-error');
                $('#' + errorId).show();
            }

            // Manejar el envío del formulario
            $('#loginForm').on('submit', function(e) {
                e.preventDefault();
                
                // Limpiar errores previos
                clearErrors();
                $('#alertMessage').hide();
                
                // Obtener valores
                const email = $('#email').val().trim();
                const password = $('#password').val().trim();
                
                let hasErrors = false;
                
                // Validar email
                if (!email) {
                    showFieldError('emailGroup', 'emailError');
                    $('#emailError').text('El email es requerido');
                    hasErrors = true;
                } else if (!isValidEmail(email)) {
                    showFieldError('emailGroup', 'emailError');
                    $('#emailError').text('Por favor ingrese un email válido');
                    hasErrors = true;
                }
                
                // Validar contraseña
                if (!password) {
                    showFieldError('passwordGroup', 'passwordError');
                    hasErrors = true;
                } else if (password.length < 6) {
                    showFieldError('passwordGroup', 'passwordError');
                    $('#passwordError').text('La contraseña debe tener al menos 6 caracteres');
                    hasErrors = true;
                }
                
                // Si hay errores, no continuar
                if (hasErrors) {
                    showMessage('Por favor corrija los errores en el formulario', 'danger');
                    return;
                }
                
                // Si todo está bien, mostrar mensaje de éxito
                showMessage('Formulario válido - En una aplicación real se enviaría al servidor', 'success');
            });

            // Limpiar errores cuando el usuario empiece a escribir
            $('#email, #password').on('input', function() {
                const fieldId = $(this).closest('.form-group').attr('id');
                $('#' + fieldId).removeClass('has-error');
                $('#' + fieldId + ' .error-message').hide();
            });
        });
    </script>
</body>
</html>
